<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Same CSS as teacher dashboard but with student-specific animations */
        :root {
            --primary-bg: #1a0b2e;
            --secondary-bg: #2d1b4e;
            --accent-color: #c026d3;
            --accent-secondary: #ec4899;
            --accent-glow: rgba(192, 38, 211, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #e9d5ff;
            --card-bg: rgba(45, 27, 78, 0.8);
            --border-color: #7e22ce;
            --success: #a855f7;
            --error: #f43f5e;
            --gradient: linear-gradient(135deg, #1a0b2e, #2d1b4e, #4c1d95);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: var(--gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            animation: gradientShift 8s ease infinite;
            background-size: 200% 200%;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 30px;
            animation: slideDown 0.8s ease;
        }
        
        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .role-badge {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 10px var(--accent-glow);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 14px 26px;
            background: var(--card-bg);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            color: #ffffff;
            
        }
        
        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .tab:hover::before {
            left: 100%;
        }
        
        .tab.active {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 20px var(--accent-glow); }
            to { box-shadow: 0 0 30px var(--accent-color); }
        }
        
        .tab:hover:not(.active) {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        
        .content-section {
            display: none;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid var(--border-color);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .content-section.active {
            display: block;
        }
        
        .section-title {
            font-size: 26px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            animation: slideInLeft 0.6s ease;
        }
        
        @keyframes slideInLeft {
            from { transform: translateX(-30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .assignment-card, .grade-card {
            background: linear-gradient(135deg, rgba(76, 29, 149, 0.6), rgba(124, 58, 237, 0.4));
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.2);
            animation: cardAppear 0.6s ease;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes cardAppear {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .assignment-card::before, .grade-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-secondary));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .assignment-card:hover::before, .grade-card:hover::before {
            transform: scaleX(1);
        }
        
        .assignment-card:hover, .grade-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 30px rgba(192, 38, 211, 0.4);
            border-color: var(--accent-color);
        }
        
        .assignment-title {
            font-size: 20px;
            margin-bottom: 12px;
            color: var(--accent-secondary);
            font-weight: 700;
            animation: textGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes textGlow {
            from { text-shadow: 0 0 5px var(--accent-glow); }
            to { text-shadow: 0 0 15px var(--accent-secondary); }
        }
        
        .assignment-details {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
            background: rgba(124, 58, 237, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .detail-item:hover {
            transform: scale(1.05);
            background: rgba(124, 58, 237, 0.4);
        }
        
        .assignment-description {
            margin-bottom: 18px;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
            color: white;
            box-shadow: 0 0 15px var(--accent-glow);
            margin-right: 10px;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px var(--accent-glow);
        }
        
        .btn:active {
            transform: translateY(0) scale(0.95);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
        }
        
        .btn-secondary:hover {
            background: rgba(192, 38, 211, 0.1);
        }
        
        .form-group {
            margin-bottom: 25px;
            animation: slideInRight 0.6s ease;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--accent-secondary);
        }
        
        input, textarea, select {
            width: 100%;
            padding: 14px;
            background: rgba(30, 15, 60, 0.8);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
            background: rgba(45, 27, 78, 0.9);
            transform: scale(1.02);
        }
        
        .submission-status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            animation: bounce 1s ease;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        .submitted {
            background: rgba(168, 85, 247, 0.3);
            color: #a855f7;
            border: 1px solid #a855f7;
        }
        
        .pending {
            background: rgba(251, 146, 60, 0.3);
            color: #fb923c;
            border: 1px solid #fb923c;
        }
        
        .overdue {
            background: rgba(244, 63, 94, 0.3);
            color: var(--error);
            border: 1px solid var(--error);
        }
        
        .graded {
            background: rgba(34, 197, 94, 0.3);
            color: #22c55e;
            border: 1px solid #22c55e;
        }
        
        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
            animation: pulse 2s infinite;
        }
        
        .empty-state i {
            font-size: 60px;
            margin-bottom: 20px;
            color: var(--accent-color);
        }
        
        .notification {
            position: fixed;
            top: 25px;
            right: 25px;
            padding: 18px 24px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.4s ease, slideOut 0.4s ease 3.6s forwards;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        
        .notification.success {
            background: linear-gradient(135deg, var(--success), #8b5cf6);
        }
        
        .notification.error {
            background: linear-gradient(135deg, var(--error), #e11d48);
        }

        /* Student specific animations */
        .floating-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .file-upload-area {
            border: 3px dashed var(--border-color);
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(76, 29, 149, 0.2);
            animation: pulse 2s infinite;
        }
        
        .file-upload-area:hover {
            border-color: var(--accent-color);
            background: rgba(192, 38, 211, 0.1);
            transform: scale(1.02);
            animation: none;
        }
        
        .file-upload-area i {
            font-size: 48px;
            color: var(--accent-color);
            margin-bottom: 15px;
        }
        
        .grade-display {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
            animation: scaleIn 0.5s ease;
        }
        
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .assignment-details {
                flex-direction: column;
                gap: 10px;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo floating-animation">EDU-LMS</div>
            <div class="user-info">
                <div class="role-badge">Student</div>
                <div class="avatar">SJ</div>
                <div>Alice Johnson</div>
            </div>
        </header>
        
        <div class="tabs">
            <button class="tab active" onclick="showSection('view-assignments')">📚 View Assignments</button>
            <button class="tab" onclick="showSection('submit-work')">📤 Submit Assignment</button>
            <button class="tab" onclick="showSection('view-grades')">🎓 My Grades</button>
        </div>
        
        <!-- View Assignments Section -->
        <div id="view-assignments" class="content-section active">
            <h2 class="section-title">Available Assignments</h2>
            <div id="assignmentsList">
                <div class="empty-state">
                    <i class="fas fa-book-open floating-animation"></i>
                    <h3>No Assignments Available</h3>
                    <p>Your teacher will post assignments here soon.</p>
                </div>
            </div>
        </div>
        
        <!-- Submit Work Section -->
        <div id="submit-work" class="content-section">
            <h2 class="section-title">Submit Assignment</h2>
            
            <form id="submissionForm">
                <div class="form-group">
                    <label for="assignmentSelect">📋 Select Assignment</label>
                    <select id="assignmentSelect" required>
                        <option value="">Choose an assignment</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="submissionNotes">💬 Submission Notes (Optional)</label>
                    <textarea id="submissionNotes" rows="4" placeholder="Add any notes about your submission"></textarea>
                </div>
                
                <div class="form-group">
                    <label>📎 Upload Files</label>
                    <div class="file-upload-area" id="fileUploadArea">
                        <i class="fas fa-cloud-upload-alt floating-animation"></i>
                        <p>Drag and drop files here or click to browse</p>
                        <input type="file" id="fileInput" style="display: none;" multiple>
                    </div>
                    <div id="fileList" style="margin-top: 15px;"></div>
                </div>
                
                <button type="submit" class="btn">🚀 Submit Assignment</button>
            </form>
        </div>
        
        <!-- View Grades Section -->
        <div id="view-grades" class="content-section">
            <h2 class="section-title">My Grades</h2>
            <div id="gradesList">
                <div class="empty-state">
                    <i class="fas fa-chart-line floating-animation"></i>
                    <h3>No Grades Yet</h3>
                    <p>Your grades will appear here once assignments are graded.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get shared data from localStorage
        const assignments = JSON.parse(localStorage.getItem('assignments')) || [];
        const submissions = JSON.parse(localStorage.getItem('submissions')) || [];
        const currentStudent = { id: 1, name: "Alice Johnson" };

        // Tab navigation with animation
        function showSection(sectionId) {
            // Add exit animation to current section
            const currentSection = document.querySelector('.content-section.active');
            if (currentSection) {
                currentSection.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => {
                    currentSection.classList.remove('active');
                }, 250);
            }

            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            setTimeout(() => {
                document.getElementById(sectionId).classList.add('active');
                event.target.classList.add('active');
                
                // Refresh section data
                if (sectionId === 'view-assignments') loadAssignments();
                if (sectionId === 'submit-work') loadAssignmentDropdown();
                if (sectionId === 'view-grades') loadGrades();
            }, 250);
        }

        // Load assignments for student with animation
        function loadAssignments() {
            const list = document.getElementById('assignmentsList');
            
            if (assignments.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-book-open floating-animation"></i>
                        <h3>No Assignments Available</h3>
                        <p>Your teacher will post assignments here soon.</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = assignments.map((assignment, index) => {
                const submission = submissions.find(s => 
                    s.assignmentId === assignment.id && s.studentId === currentStudent.id
                );
                const status = getSubmissionStatus(assignment.id);
                const isOverdue = new Date() > new Date(assignment.dueDate) && !submission;
                
                return `
                    <div class="assignment-card" style="animation-delay: ${index * 0.1}s">
                        <h3 class="assignment-title">${assignment.title}</h3>
                        <div class="assignment-details">
                            <div class="detail-item">🎯 ${assignment.course}</div>
                            <div class="detail-item">⏰ Due: ${new Date(assignment.dueDate).toLocaleDateString()}</div>
                            <div class="detail-item">⭐ ${assignment.maxPoints} Points</div>
                            <div class="detail-item">
                                <span class="submission-status ${isOverdue ? 'overdue' : status === 'graded' ? 'graded' : status === 'submitted' ? 'submitted' : 'pending'}">
                                    ${isOverdue ? '⚠️ Overdue' : status === 'graded' ? '✅ Graded' : status === 'submitted' ? '📤 Submitted' : '📝 Pending'}
                                </span>
                            </div>
                        </div>
                        <p class="assignment-description">${assignment.description}</p>
                        <div class="assignment-actions">
                            ${!submission ? 
                                `<button class="btn" onclick="showSubmitSection(${assignment.id})">📤 Submit Now</button>` :
                                `<button class="btn btn-secondary" onclick="viewSubmission(${submission.id})">👀 View Submission</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Load assignment dropdown for submission
        function loadAssignmentDropdown() {
            const select = document.getElementById('assignmentSelect');
            const unsubmittedAssignments = assignments.filter(assignment => {
                const submission = submissions.find(s => 
                    s.assignmentId === assignment.id && s.studentId === currentStudent.id
                );
                return !submission && new Date() <= new Date(assignment.dueDate);
            });
            
            select.innerHTML = '<option value="">Select Assignment</option>' +
                unsubmittedAssignments.map(assignment => `
                    <option value="${assignment.id}">${assignment.title} (Due: ${new Date(assignment.dueDate).toLocaleDateString()})</option>
                `).join('');
        }

        // Load student grades with animation
        function loadGrades() {
            const studentSubmissions = submissions.filter(s => s.studentId === currentStudent.id && s.grade);
            const list = document.getElementById('gradesList');
            
            if (studentSubmissions.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-chart-line floating-animation"></i>
                        <h3>No Grades Yet</h3>
                        <p>Your grades will appear here once assignments are graded.</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = studentSubmissions.map((submission, index) => {
                const assignment = assignments.find(a => a.id === submission.assignmentId);
                const percentage = ((submission.grade / assignment.maxPoints) * 100).toFixed(1);
                const gradeClass = getGradeClass(percentage);
                
                return `
                    <div class="grade-card" style="animation-delay: ${index * 0.1}s">
                        <div class="grade-header">
                            <h3 class="assignment-title">${assignment.title}</h3>
                            <div class="grade-display ${gradeClass}">
                                ${submission.grade}/${assignment.maxPoints} (${percentage}%)
                            </div>
                        </div>
                        <div class="assignment-details">
                            <div class="detail-item">🎯 ${assignment.course}</div>
                            <div class="detail-item">📅 Submitted: ${new Date(submission.submittedDate).toLocaleDateString()}</div>
                            <div class="detail-item">⭐ Maximum Points: ${assignment.maxPoints}</div>
                        </div>
                        ${submission.feedback ? `
                            <div class="grade-feedback">
                                <strong>💬 Teacher Feedback:</strong> ${submission.feedback}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // File upload functionality
        document.getElementById('fileUploadArea').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });
        
        document.getElementById('fileInput').addEventListener('change', function() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';
            
            Array.from(this.files).forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'detail-item';
                fileItem.style.animationDelay = `${index * 0.1}s`;
                fileItem.innerHTML = `📄 ${file.name} (${formatFileSize(file.size)})`;
                fileList.appendChild(fileItem);
            });
        });

        // Submit assignment with animation
        document.getElementById('submissionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const assignmentId = document.getElementById('assignmentSelect').value;
            const notes = document.getElementById('submissionNotes').value;
            const files = document.getElementById('fileInput').files;
            
            if (!assignmentId) {
                showNotification('Please select an assignment', 'error');
                return;
            }
            
            if (files.length === 0) {
                showNotification('Please upload at least one file', 'error');
                return;
            }
            
            const newSubmission = {
                id: Date.now(),
                assignmentId: parseInt(assignmentId),
                studentId: currentStudent.id,
                studentName: currentStudent.name,
                files: Array.from(files).map(f => f.name),
                notes: notes,
                submittedDate: new Date().toISOString(),
                grade: null,
                feedback: ''
            };
            
            submissions.push(newSubmission);
            localStorage.setItem('submissions', JSON.stringify(submissions));
            
            // Success animation
            const btn = this.querySelector('button');
            btn.innerHTML = '✅ Assignment Submitted!';
            btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
            
            setTimeout(() => {
                showNotification('Assignment submitted successfully!', 'success');
                this.reset();
                document.getElementById('fileList').innerHTML = '';
                loadAssignments();
                loadAssignmentDropdown();
                
                // Return button to normal
                setTimeout(() => {
                    btn.innerHTML = '🚀 Submit Assignment';
                    btn.style.background = '';
                }, 1000);
            }, 1500);
        });

        // Helper functions
        function getSubmissionStatus(assignmentId) {
            const submission = submissions.find(s => 
                s.assignmentId === assignmentId && s.studentId === currentStudent.id
            );
            
            if (!submission) return 'pending';
            if (submission.grade) return 'graded';
            return 'submitted';
        }

        function getGradeClass(percentage) {
            if (percentage >= 90) return 'grade-A';
            if (percentage >= 80) return 'grade-B';
            if (percentage >= 70) return 'grade-C';
            if (percentage >= 60) return 'grade-D';
            return 'grade-F';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showSubmitSection(assignmentId) {
            showSection('submit-work');
            setTimeout(() => {
                document.getElementById('assignmentSelect').value = assignmentId;
                document.getElementById('assignmentSelect').scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }

        function viewSubmission(submissionId) {
            showNotification('👀 View submission details feature coming soon!', 'success');
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 4000);
        }

        function logout() {
            localStorage.removeItem('studentToken');
            window.location.href = 'login.html';
        }

        // Add exit animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeOut {
                from { opacity: 1; transform: translateY(0); }
                to { opacity: 0; transform: translateY(-20px); }
            }
            
            .grade-A { color: #a855f7; }
            .grade-B { color: #c084fc; }
            .grade-C { color: #d8b4fe; }
            .grade-D { color: #e9d5ff; }
            .grade-F { color: #f43f5e; }
        `;
        document.head.appendChild(style);

        // Initial load
        loadAssignments();
        loadAssignmentDropdown();
        loadGrades();
    </script>
</body>
</html>
